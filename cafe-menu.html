<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>منوی کافه آرامش</title><meta name="description" content="منوی کافه آرامش"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300..800&display=swap" rel="stylesheet"><style>/*

:root {
  --green: #1E3932;
  --cream: #F7F2E8;
  --beige: #E8DCC3;
  --gold: #C6A15B;

  --gold-deep: color-mix(in srgb, var(--gold) 62%, var(--green));
  --muted: color-mix(in srgb, var(--green) 64%, var(--cream));
  --line: color-mix(in srgb, var(--green) 14%, transparent);
  --card: color-mix(in srgb, var(--cream) 62%, white);

  --speed: 1;
  --blur: 14px;
  --ease: cubic-bezier(.22, .8, .24, 1);
  --t: calc(.45s * var(--speed));
  --bar-h: 66px;
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  padding-top: var(--bar-h);
  font-family: 'VazirLocal', 'Vazirmatn', Tahoma, 'Segoe UI', sans-serif;
  background: var(--cream);
  color: var(--green);
  line-height: 1.85;
  -webkit-font-smoothing: antialiased;
  overflow-x: clip;
}
body.is-intro, body.modal-open { overflow: hidden; }
img { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; border-radius: 6px; }
.num { direction: ltr; unicode-bidi: isolate; display: inline-block; }
[hidden] { display: none !important; }

/* ───────── انیمیشن آغازین ───────── */
#intro {
  position: fixed; inset: 0; z-index: 200;
  display: grid; place-items: center;
  background:
    radial-gradient(60% 50% at 50% 38%, color-mix(in srgb, var(--gold) 16%, transparent), transparent 70%),
    var(--green);
  transition: opacity .95s ease, visibility .95s, transform 1.1s var(--ease);
}
#intro.out { opacity: 0; visibility: hidden; transform: scale(1.04); pointer-events: none; }
.intro-in { text-align: center; color: var(--cream); padding: 24px; }
.intro-logo {
  width: 88px; height: 88px; object-fit: contain; margin: 0 auto 22px;
  border-radius: 50%; background: var(--cream); padding: 8px;
  opacity: 0; animation: fadeUp 1s .1s var(--ease) forwards;
}
.intro-name {
  font-size: clamp(2.5rem, 10vw, 4.8rem); font-weight: 800; line-height: 1.45;
  opacity: 0; filter: blur(14px); transform: translateY(14px);
  background: linear-gradient(100deg, var(--cream) 33%, var(--gold) 50%, var(--cream) 67%);
  background-size: 300% 100%; background-position: 100% 0;
  -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: nameIn 1.5s .3s var(--ease) forwards, sweep 1.9s .9s ease-in-out forwards;
}
.intro-line {
  width: 0; height: 1px; margin: 14px auto 0;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  animation: lineIn 1.2s .8s var(--ease) forwards;
}
.intro-tag {
  margin-top: 16px; font-size: 1rem; letter-spacing: 0;
  color: color-mix(in srgb, var(--cream) 72%, var(--green));
  opacity: 0; animation: fadeUp 1s 1.3s var(--ease) forwards;
}
@keyframes nameIn { to { opacity: 1; filter: blur(0); transform: none; } }
@keyframes sweep { to { background-position: 0 0; } }
@keyframes lineIn { to { width: min(280px, 62vw); } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

/* ───────── نوار بالایی ───────── */
.topbar {
  position: fixed; inset: 0 0 auto 0; z-index: 50; height: var(--bar-h);
  background: color-mix(in srgb, var(--cream) 88%, transparent);
  -webkit-backdrop-filter: blur(14px) saturate(1.2); backdrop-filter: blur(14px) saturate(1.2);
  border-bottom: 1px solid var(--line);
  transition: box-shadow var(--t) var(--ease);
}
.topbar.scrolled { box-shadow: 0 8px 26px -16px rgba(30, 57, 50, .5); }
.topbar-in {
  max-width: 1180px; height: 100%; margin: 0 auto; padding: 0 20px;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px;
  direction: ltr; /* چیدمان فیزیکی: تلفن‌ها چپ، نام وسط، «درباره ما» راست */
}
.tb-left { display: flex; align-items: center; gap: 18px; justify-self: start; direction: rtl; min-width: 0; }
.tb-right { justify-self: end; direction: rtl; }
.tb-phone {
  display: inline-flex; align-items: center; gap: 8px; font-size: .88rem; color: var(--muted);
  transition: color var(--t) var(--ease);
}
.tb-phone svg { flex: none; }
.tb-phone:hover { color: var(--gold-deep); }
.tb-brand {
  display: inline-flex; align-items: center; gap: 10px; direction: rtl;
  font-weight: 800; font-size: 1.22rem; max-width: 46vw; min-width: 0;
  transition: color var(--t) var(--ease);
}
.tb-brand span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tb-brand img { width: 32px; height: 32px; object-fit: contain; border-radius: 50%; flex: none; }
.tb-brand:hover { color: var(--gold-deep); }
.tb-about {

  border: 1px solid var(--line);

}
.tb-about:hover { background: var(--green); color: var(--cream); border-color: var(--green); }

/* ───────── هیرو ───────── */
.hero {
  position: relative; isolation: isolate; overflow: hidden; text-align: center;
  background: var(--green); color: var(--cream);
  padding: 76px 20px 88px; border-radius: 0 0 44px 44px;
}
.hero::before {
  content: ""; position: absolute; inset: 0; z-index: -1;
  background:
    radial-gradient(55% 80% at 50% 0%, color-mix(in srgb, var(--gold) 24%, transparent), transparent 70%),
    radial-gradient(40% 60% at 92% 100%, color-mix(in srgb, var(--gold) 14%, transparent), transparent 70%),
    radial-gradient(35% 55% at 6% 90%, color-mix(in srgb, var(--gold) 10%, transparent), transparent 70%);
}
.hero-logo {
  width: 96px; height: 96px; object-fit: contain; margin: 0 auto 20px;
  background: var(--cream); border-radius: 50%; padding: 9px;
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--gold) 60%, transparent), 0 14px 30px -14px rgba(0, 0, 0, .6);

.hero h1 { margin: 0; font-size: clamp(2.1rem, 5.6vw, 3.4rem); font-weight: 800; line-height: 1.4; }
.hero p { margin: 8px auto 0; max-width: 520px; color: color-mix(in srgb, var(--cream) 78%, var(--green)); font-size: 1.05rem; }
.orn { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 28px; }
.orn::before, .orn::after { content: ""; width: 70px; height: 1px; }
.orn::before { background: linear-gradient(90deg, transparent, var(--gold)); }
.orn::after { background: linear-gradient(270deg, transparent, var(--gold)); }
.orn i { width: 8px; height: 8px; background: var(--gold); transform: rotate(45deg); }

/* ───────── ناوبری دسته‌ها ───────── */
.catnav {
  position: sticky; top: var(--bar-h); z-index: 40;
  background: color-mix(in srgb, var(--cream) 90%, transparent);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
  margin-top: -1px;
}
.catnav-in {
  max-width: 1180px; margin: 0 auto; padding: 12px 20px;
  display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none;
}
.catnav-in::-webkit-scrollbar { display: none; }
.chip {
  flex: none; padding: 6px 18px; border-radius: 999px; font-size: .93rem; font-weight: 500;
  border: 1px solid var(--line); white-space: nowrap;
  transition: background var(--t) var(--ease), color var(--t) var(--ease), border-color var(--t) var(--ease);
}
.chip:hover { border-color: var(--gold); }
.chip.active { background: var(--green); color: var(--cream); border-color: var(--green); }

/* ───────── منو ───────── */
.menu { max-width: 1180px; margin: 0 auto; padding: 18px 20px 30px; }
.cat { padding-top: 30px; scroll-margin-top: calc(var(--bar-h) + 66px); }
.cat-h { display: flex; align-items: center; gap: 16px; margin: 0 0 22px; font-size: 1.55rem; font-weight: 700; }
.cat-h::after { content: ""; flex: 1; height: 1px; background: linear-gradient(to left, var(--gold), transparent); opacity: .7; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 22px; }

.card {
  display: flex; flex-direction: column; width: 100%; height: 100%; text-align: right; overflow: hidden;
  background: var(--card); border: 1px solid var(--line); border-radius: 22px;
  transition: transform var(--t) var(--ease), box-shadow var(--t) var(--ease), border-color var(--t) var(--ease);
}
.card-img { aspect-ratio: 1 / 1; overflow: hidden; background: var(--beige); }
.card-img img { width: 100%; height: 100%; object-fit: cover; transition: transform calc(var(--t) * 1.8) var(--ease); }
.ph { display: grid; place-items: center; width: 100%; height: 100%; color: var(--gold); }
.card-b { padding: 16px 18px 18px; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 10px; }
.card-n { font-weight: 600; font-size: 1.06rem; }
.card-p { color: var(--gold-deep); font-weight: 600; font-size: .94rem; white-space: nowrap; }
.card-p small { font-weight: 400; font-size: .78rem; opacity: .85; }

@media (hover: hover) {
  html:not(.no-hover) .card:hover {
    transform: translateY(-6px);
    border-color: color-mix(in srgb, var(--gold) 65%, transparent);
    box-shadow: 0 24px 40px -24px rgba(30, 57, 50, .55);
  }
  html:not(.no-hover) .card:hover .card-img img { transform: scale(1.07); }
}

.empty { text-align: center; padding: 80px 20px; color: var(--muted); }

/* ظاهر شدن هنگام اسکرول */
.reveal {
  opacity: 0; transform: translateY(22px);
  transition: opacity calc(var(--t) * 1.5) var(--ease), transform calc(var(--t) * 1.5) var(--ease);
  transition-delay: calc(var(--i, 0) * 70ms);
}
.reveal.in { opacity: 1; transform: none; }
html.no-reveal .reveal { opacity: 1; transform: none; transition: none; }

/* ───────── درباره ما / تماس ───────── */
.about {
  margin-top: 36px; padding: 66px 20px 26px; scroll-margin-top: var(--bar-h);
  background: var(--green); color: var(--cream); border-radius: 44px 44px 0 0;
}
.about-in { max-width: 1000px; margin: 0 auto; display: grid; grid-template-columns: 1.35fr 1fr; gap: 52px; }
.about h2 { margin: 0 0 14px; font-size: 1.5rem; color: var(--gold); font-weight: 700; }
.about-text { margin: 0; white-space: pre-line; color: color-mix(in srgb, var(--cream) 86%, var(--green)); }
.contact { list-style: none; margin: 0; padding: 0; display: grid; gap: 16px; }
.contact li { display: flex; gap: 14px; align-items: flex-start; }
.contact .row-link { display: flex; gap: 14px; align-items: flex-start; }
.contact .ic {
  flex: none; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%;
  border: 1px solid color-mix(in srgb, var(--gold) 55%, transparent); color: var(--gold);
  transition: background var(--t) var(--ease), color var(--t) var(--ease);
}
.contact a:hover .ic { background: var(--gold); color: var(--green); }
.contact .lbl { display: block; font-size: .8rem; opacity: .65; line-height: 1.5; }
.contact .val { font-weight: 500; line-height: 1.7; white-space: pre-line; }
.copy {
  max-width: 1000px; margin: 46px auto 0; padding-top: 18px; text-align: center; font-size: .82rem; opacity: .7;
  border-top: 1px solid color-mix(in srgb, var(--cream) 16%, transparent);
}

/* ───────── پاپ‌آپ محصول ───────── */
.modal {
  position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 20px;
  background: color-mix(in srgb, var(--green) 0%, transparent);
  -webkit-backdrop-filter: blur(0px); backdrop-filter: blur(0px);
  transition: background calc(var(--t) * 1.2) var(--ease), -webkit-backdrop-filter calc(var(--t) * 1.2) var(--ease), backdrop-filter calc(var(--t) * 1.2) var(--ease);
}
.modal.open {
  background: color-mix(in srgb, var(--green) 40%, transparent);
  -webkit-backdrop-filter: blur(var(--blur)); backdrop-filter: blur(var(--blur));

.m-card {

  box-shadow: 0 50px 90px -30px rgba(0, 0, 0, .55), 0 0 0 1px color-mix(in srgb, var(--gold) 30%, transparent);
  opacity: 0; transform: translateY(26px) scale(.96);
  transition: opacity calc(var(--t) * 1.2) var(--ease), transform calc(var(--t) * 1.4) var(--ease);

.modal.open .m-card { opacity: 1; transform: none; }
.m-img { aspect-ratio: 4 / 3.2; background: var(--beige); overflow: hidden; }
.m-img img { width: 100%; height: 100%; object-fit: cover; }
.m-body { padding: 24px 26px 28px; }
.m-head { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.m-head h3 { margin: 0; font-size: 1.5rem; font-weight: 800; line-height: 1.5; }
.m-price {
  padding: 3px 14px; border-radius: 999px; font-weight: 700; font-size: .98rem; white-space: nowrap;
  background: color-mix(in srgb, var(--gold) 20%, transparent); color: var(--gold-deep);

.m-desc { margin: 12px 0 0; color: var(--muted); white-space: pre-line; }
.m-ing { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--line); }
.m-ing h4 { margin: 0 0 10px; font-size: .95rem; color: var(--gold-deep); font-weight: 700; }
.m-ing ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.m-ing li { padding: 3px 14px; border-radius: 999px; font-size: .86rem; background: var(--beige); }
.m-close {
  position: absolute; top: 14px; left: 14px; z-index: 2; width: 40px; height: 40px; display: grid; place-items: center;
  border-radius: 50%; background: color-mix(in srgb, var(--cream) 90%, transparent); border: 1px solid var(--line);

  transition: transform var(--t) var(--ease), background var(--t) var(--ease), color var(--t) var(--ease);

.m-close:hover { background: var(--green); color: var(--cream); transform: rotate(90deg); }

  .m-card.has-img { width: min(100%, 860px); display: grid; grid-template-columns: 1fr 1fr; max-height: min(88vh, 560px); }
  .m-card.has-img .m-img { aspect-ratio: auto; height: 100%; min-height: 380px; }
  .m-card.has-img .m-body { padding: 36px 34px; overflow: auto; align-self: center; }
}
@media (max-width: 860px) {
  .about-in { grid-template-columns: 1fr; gap: 36px; }
}
@media (max-width: 720px) {
  :root { --bar-h: 60px; }
  .topbar-in { padding: 0 14px; gap: 8px; }
  .tb-left { gap: 8px; }
  .tb-phone { width: 36px; height: 36px; justify-content: center; border: 1px solid var(--line); border-radius: 50%; color: var(--green); }
  .tb-phone .txt { display: none; }
  .tb-brand { font-size: 1.02rem; max-width: 40vw; }
  .tb-brand img { width: 26px; height: 26px; }
  .tb-about { padding: 6px 13px; font-size: .84rem; }
  .hero { padding: 56px 20px 68px; border-radius: 0 0 32px 32px; }
  .about { border-radius: 32px 32px 0 0; padding-top: 54px; }
}
@media (max-width: 560px) {
  .menu { padding: 10px 14px 24px; }

  .card-b { padding: 12px 13px 14px; flex-direction: column; gap: 0; }

  .cat-h { font-size: 1.3rem; }

}
@media (max-width: 360px) {

}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .reveal { opacity: 1; transform: none; transition: none; }
  .intro-name, .intro-logo, .intro-tag { animation-duration: .01s; animation-delay: 0s; }
  .intro-line { animation-duration: .01s; animation-delay: 0s; }
